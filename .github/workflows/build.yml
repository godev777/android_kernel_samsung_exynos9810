name: Build NullPoint Kernel (KernelSU-Next + SuSFS 2.3.0)

    on:
      workflow_dispatch:
      push:
        branches:
          - lineage-24.0-xxksu3-susfs2
          - main

    jobs:
      build:
        name: Compile Exynos 9810 Crownlte Kernel
        runs-on: ubuntu-22.04

        steps:
          - name: Checkout Kernel Source
            uses: actions/checkout@v4
            with:
              submodules: recursive
              fetch-depth: 1

          - name: Install Build Dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
                git curl wget zip python3 python-is-python3 cpio lz4 zstd tar libarchive-tools

          - name: Download Toolchains (Proton Clang & GCC)
            run: |
              mkdir -p toolchain
              cd toolchain
              echo "Cloning Proton Clang from GitHub..."
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
              echo "Cloning GCC AArch64 & ARM32 from GitHub..."
              git clone --depth=1
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git
              gcc64
              git clone --depth=1
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
              cd ..

          - name: Setup KernelSU-Next Legacy Driver
            run: |
              echo "Removing legacy KernelSU..."
              rm -rf KernelSU drivers/kernelsu
              echo "Installing KernelSU-Next legacy driver for Linux 4.9..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash
              -s legacy

          - name: Compile Kernel Image & DTB
            run: |
              export PATH="$(pwd)/toolchain/clang/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH"
              export ARCH=arm64
              export SUBARCH=arm64
              export CC=clang
              export CLANG_TRIPLE=aarch64-linux-gnu-
              export CROSS_COMPILE=aarch64-linux-android-
              export CROSS_COMPILE_ARM32=arm-linux-androideabi-

              # Defconfig for crownlte
              make O=out exynos9810-crownlte_defconfig

              # Ensure KernelSU, SuSFS, BBR, and optimization configs are enabled
              ./scripts/config --file out/.config \
                -e CONFIG_KSU \
                -e CONFIG_KSU_SUSFS \
                -e CONFIG_TCP_CONG_BBR \
                -d CONFIG_DEFAULT_BIC \
                -e CONFIG_DEFAULT_BBR \
                -e CONFIG_NETFILTER_XT_TARGET_HL \
                -e CONFIG_IP_NF_TARGET_TTL \
                -e CONFIG_IP6_NF_TARGET_HL \
                -e CONFIG_ZRAM_DEF_COMP_ZSTD \
                -e CONFIG_EROFS_FS

              # Compile Kernel
              make -j$(nproc --all) O=out

              echo "Kernel build finished!"
              ls -lh out/arch/arm64/boot/Image*

          - name: Package AnyKernel3 Flashable ZIP
            run: |
              git clone https://github.com/osm0sis/AnyKernel3.git anykernel
              cd anykernel

              # Configure AnyKernel3 for Galaxy Note 9 (crownlte)
              sed -i 's/device.name1=.*/device.name1=crownlte/g' anykernel.sh
              sed -i 's/device.name2=.*/device.name2=star2lte/g' anykernel.sh
              sed -i 's/device.name3=.*/device.name3=starlte/g' anykernel.sh
              sed -i 's|block=auto;|block=/dev/block/platform/11120000.ufs/by-name/BOOT;|g' anykernel.sh
              sed -i 's/is_slot_device=0;/is_slot_device=0;/g' anykernel.sh

              # Copy compiled Image
              cp ../out/arch/arm64/boot/Image .

              # Package into ZIP
              ZIP_NAME="NullPoint-KernelSU-Next-v2.5-crownlte-$(date +%Y%m%d).zip"
              zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
              echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
              cd ..

          - name: Upload Kernel Flashable ZIP to GitHub Artifacts
            uses: actions/upload-artifact@v4
            with:
              name: ${{ env.ZIP_NAME }}
              path: ${{ env.ZIP_NAME }}
