name: Build NullPoint Kernel (KernelSU-Next + SuSFS 2.3.0)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0-xxksu3-susfs2
      - main

jobs:
  build:
    name: Compile Exynos 9810 Crownlte Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget zip python3 python-is-python3 cpio lz4 zstd tar libarchive-tools \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Download Proton Clang Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          echo "Cloning Proton Clang from GitHub..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          cd ..

      - name: Setup KernelSU-Next Legacy Driver
        run: |
          echo "Removing legacy KernelSU..."
          rm -rf KernelSU drivers/kernelsu
          echo "Installing KernelSU-Next legacy driver for Linux 4.9..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Patch Defconfig, Headers & Neutralize Stack Protector
        run: |
          echo "Disabling stack protector in all defconfigs..."
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' arch/arm64/configs/*defconfig || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' arch/arm64/configs/*defconfig || true

          echo "Disabling -Werror and prepare-compiler-check in Makefile..."
          sed -i 's/-Werror//g' Makefile arch/arm64/Makefile || true
          sed -i 's/prepare: prepare-compiler-check/prepare:/g' Makefile || true
          sed -i 's/prepare-compiler-check//g' Makefile || true
          sed -i 's/Cannot use CONFIG_CC_STACKPROTECTOR_STRONG.*/# bypassed/g' Makefile || true

          echo "Patching compiler-gcc.h version check & error attribute..."
          sed -i 's/# error Sorry, your version of GCC is too old/\/\/# error/' include/linux/compiler-gcc.h || true
          sed -i 's/#error Sorry, your version of GCC is too old/\/\/#error/' include/linux/compiler-gcc.h || true
          sed -i 's/__attribute__((error(message)))//g' include/linux/compiler-gcc.h || true
          sed -i 's/__attribute__((warning(message)))//g' include/linux/compiler-gcc.h || true

          echo "Patching DTC yylloc for modern GCC host..."
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: Compile Kernel Image & DTB
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export HOSTCFLAGS="-fcommon"
          export KCFLAGS="-Wno-error -Wno-unknown-attributes -Wno-error=unknown-attributes -Wno-format"

          # Defconfig for crownlte with Clang passed directly
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- exynos9810-crownlte_defconfig

          # Ensure Stack Protector is NONE and KernelSU, SuSFS, BBR, and optimization configs are enabled
          ./scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_TCP_CONG_BBR \
            -d CONFIG_DEFAULT_BIC \
            -e CONFIG_DEFAULT_BBR \
            -e CONFIG_NETFILTER_XT_TARGET_HL \
            -e CONFIG_IP_NF_TARGET_TTL \
            -e CONFIG_IP6_NF_TARGET_HL \
            -e CONFIG_ZRAM_DEF_COMP_ZSTD \
            -e CONFIG_EROFS_FS

          # Compile Kernel explicitly passing Clang, LLVM tools and -Wno-error flags
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error -Wno-unknown-attributes -Wno-error=unknown-attributes -Wno-format"

          echo "Kernel build finished!"
          ls -lh out/arch/arm64/boot/Image*

      - name: Package AnyKernel3 Flashable ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel

          # Configure AnyKernel3 for Galaxy Note 9 (crownlte)
          sed -i 's/device.name1=.*/device.name1=crownlte/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=star2lte/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=starlte/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/platform/11120000.ufs/by-name/BOOT;|g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=0;/g' anykernel.sh

          # Copy compiled Image
          cp ../out/arch/arm64/boot/Image .

          # Package into ZIP
          ZIP_NAME="NullPoint-KernelSU-Next-v2.5-crownlte-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          cd ..

      - name: Upload Kernel Flashable ZIP to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
