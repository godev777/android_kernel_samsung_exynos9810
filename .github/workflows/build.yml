name: Build Kernel Note 9

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Exynos 9810 Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0-xxksu3-susfs2
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo add-apt-repository universe -y || true
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git libssl-dev libelf-dev libncurses5-dev python3 libtinfo5 \
            cpio lz4 zstd dwarves || sudo apt-get install -y bc bison \
            build-essential ccache curl flex git libssl-dev libelf-dev \
            libncurses-dev python3 cpio lz4 zstd

      - name: Download Clang & GCC Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android11-release gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b android11-release gcc32

      - name: Build Kernel Image
        run: |
          export PATH=$(pwd)/toolchain/clang/clang-r365631c/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- exynos9810-crownlte_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- Image.samsung

      - name: Package Artifacts
        run: |
          mkdir -p artifact
          [ -f out/arch/arm64/boot/Image ] && cp out/arch/arm64/boot/Image ./artifact/Image-exynos9810
          [ -f out/arch/arm64/boot/dt.img ] && cp out/arch/arm64/boot/dt.img ./artifact/dt.img
          [ -f out/arch/arm64/boot/Image.samsung ] && cp out/arch/arm64/boot/Image.samsung ./artifact/Image.samsung
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} ./artifact/ \; 2>/dev/null || true
          echo "=== Output Artifacts ==="
          ls -lh ./artifact/

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crownlte-KernelSU-Kernel
          path: artifact/
